name: Refresh market data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
  push:
    paths:
      - "scripts/refresh_market_data.py"
      - ".github/workflows/refresh-market-data.yml"
permissions:
  contents: write
concurrency:
  group: refresh-market-data
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance==0.2.65"
      - run: python scripts/refresh_market_data.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data/universe.json
          git diff --cached --quiet || git commit -m "Refresh daily market snapshot"
          git push
